name: GARAGE LINK Release Critical

on:
  workflow_dispatch:
    inputs:
      email_mode:
        description: Optional actual-email transport mode; machine gates never depend on it
        required: true
        default: deferred
        type: choice
        options:
          - deferred
          - manual_gmail
      staging_base_url:
        description: Exact garage-link-staging preview URL for this QA run
        required: true
        type: string
      candidate_sha:
        description: Exact 40-character SHA returned by the target Staging runtime provenance endpoint
        required: true
        type: string
      auth_config_mode:
        description: Normal runs prove redirects through Hosted Auth; use repair only for one-time Staging drift remediation
        required: true
        default: verify_by_journey
        type: choice
        options:
          - verify_by_journey
          - repair_staging_once

permissions:
  contents: read

concurrency:
  group: garage-link-release-critical
  cancel-in-progress: false

jobs:
  preflight:
    name: Staging-only preflight (no billing)
    runs-on: ubuntu-latest
    environment: garage-link-commercial-staging
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.staging_base_url }}
      E2E_TEST_SUPABASE_URL: ${{ secrets.GARAGE_STAGING_SUPABASE_URL }}
      E2E_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.GARAGE_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.GARAGE_STAGING_VERCEL_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify Staging-only execution contract
        run: node apps/garage-link/scripts/qa/release-critical-preflight.mjs

  stage-auth-contract:
    name: Staging Auth redirect and password contract
    needs: preflight
    if: ${{ inputs.auth_config_mode == 'repair_staging_once' }}
    runs-on: ubuntu-latest
    environment: garage-link-commercial-staging
    timeout-minutes: 15
    env:
      GARAGE_STAGING_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.GARAGE_STAGING_SUPABASE_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply and read back the Staging-only Auth contract
        run: node apps/garage-link/scripts/qa/release-critical-stage-auth.mjs

  machine-gates:
    name: Release-critical machine-only gates
    needs: [preflight, stage-auth-contract]
    if: ${{ always() && needs.preflight.result == 'success' && (needs.stage-auth-contract.result == 'success' || needs.stage-auth-contract.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: garage-link-commercial-staging
    timeout-minutes: 50
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.staging_base_url }}
      RELEASE_CRITICAL_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      E2E_TEST_SUPABASE_URL: ${{ secrets.GARAGE_STAGING_SUPABASE_URL }}
      E2E_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.GARAGE_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.GARAGE_STAGING_VERCEL_BYPASS_SECRET }}
      RELEASE_CRITICAL_EXECUTION_MODE: machine_only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install release-critical browsers
        run: pnpm --filter @apps/garage-link exec playwright install --with-deps chromium webkit
      - name: Run callback mechanics, CTA, inquiry, and fixture gates with guaranteed teardown
        run: node apps/garage-link/scripts/qa/release-critical-journeys.mjs

  email-transport-state:
    name: Email transport state (non-blocking machine gate)
    needs: [preflight, machine-gates]
    if: ${{ always() && needs.preflight.result == 'success' && needs.machine-gates.result == 'success' }}
    runs-on: ubuntu-latest
    environment: garage-link-commercial-staging
    timeout-minutes: 5
    steps:
      - name: Record separated email transport state
        env:
          RELEASE_CRITICAL_EMAIL_MODE: ${{ inputs.email_mode }}
          RELEASE_CRITICAL_MANUAL_GMAIL_ADDRESS: ${{ secrets.GARAGE_STAGING_RELEASE_QA_EMAIL }}
        run: |
          if [ "$RELEASE_CRITICAL_EMAIL_MODE" = "manual_gmail" ] && [ -n "$RELEASE_CRITICAL_MANUAL_GMAIL_ADDRESS" ]; then
            echo '{"state":"EMAIL_TRANSPORT_READY","mode":"manual_gmail"}'
          else
            echo '{"state":"EMAIL_TRANSPORT_WAITING","reason":"NO_PERMANENT_QA_TRANSPORT"}'
          fi
