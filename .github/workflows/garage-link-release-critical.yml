name: GARAGE LINK Release Critical

on:
  workflow_dispatch:
    inputs:
      email_mode:
        description: Email verification mode for this Staging QA run
        required: true
        default: manual_gmail
        type: choice
        options:
          - manual_gmail
      staging_base_url:
        description: Exact garage-link-staging preview URL for this QA run
        required: true
        type: string
      candidate_sha:
        description: Exact 40-character SHA returned by the target Staging runtime provenance endpoint
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: garage-link-release-critical
  cancel-in-progress: false

jobs:
  preflight:
    name: Staging-only preflight (no billing)
    runs-on: ubuntu-latest
    environment: garage-link-commercial-staging
    timeout-minutes: 10
    env:
      RELEASE_CRITICAL_EMAIL_MODE: ${{ inputs.email_mode }}
      PLAYWRIGHT_BASE_URL: ${{ secrets.GARAGE_STAGING_BASE_URL }}
      E2E_TEST_SUPABASE_URL: ${{ secrets.GARAGE_STAGING_SUPABASE_URL }}
      E2E_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.GARAGE_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.GARAGE_STAGING_VERCEL_BYPASS_SECRET }}
      RELEASE_CRITICAL_MANUAL_GMAIL_ADDRESS: ${{ secrets.GARAGE_STAGING_E2E_EMAIL }}
      GARAGE_STAGING_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.GARAGE_STAGING_SUPABASE_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify Staging-only execution contract
        run: node apps/garage-link/scripts/qa/release-critical-preflight.mjs

  stage-auth-contract:
    name: Staging Auth redirect and password contract
    needs: preflight
    runs-on: ubuntu-latest
    environment: garage-link-commercial-staging
    timeout-minutes: 15
    env:
      GARAGE_STAGING_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.GARAGE_STAGING_SUPABASE_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply and read back the Staging-only Auth contract
        run: node apps/garage-link/scripts/qa/release-critical-stage-auth.mjs

  journeys:
    name: Release-critical acquisition journeys
    needs: stage-auth-contract
    runs-on: ubuntu-latest
    environment: garage-link-commercial-staging
    timeout-minutes: 50
    env:
      PLAYWRIGHT_BASE_URL: ${{ secrets.GARAGE_STAGING_BASE_URL }}
      RELEASE_CRITICAL_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      E2E_TEST_SUPABASE_URL: ${{ secrets.GARAGE_STAGING_SUPABASE_URL }}
      E2E_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.GARAGE_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.GARAGE_STAGING_VERCEL_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install release-critical browsers
        run: pnpm --filter @apps/garage-link exec playwright install --with-deps chromium webkit
      - name: Run Staging acquisition journeys with guaranteed teardown
        run: node apps/garage-link/scripts/qa/release-critical-journeys.mjs
