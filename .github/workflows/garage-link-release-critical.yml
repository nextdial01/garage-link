name: GARAGE LINK Release Critical

on:
  workflow_dispatch:
    inputs:
      email_mode:
        description: Optional actual-email transport mode; machine gates never depend on it
        required: true
        default: deferred
        type: choice
        options:
          - deferred
          - manual_gmail
      staging_base_url:
        description: Exact garage-link-staging preview URL for this QA run
        required: true
        type: string
      auth_config_mode:
        description: Normal runs prove redirects through Hosted Auth; use repair only for one-time Staging drift remediation
        required: true
        default: verify_by_journey
        type: choice
        options:
          - verify_by_journey
          - repair_staging_once

permissions:
  contents: read

concurrency:
  group: garage-link-release-critical
  cancel-in-progress: false

jobs:
  preflight:
    name: Staging-only preflight (no billing)
    runs-on: ubuntu-latest
    environment: garage-link-commercial-staging
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.contract.outputs.source_sha }}
      base_url: ${{ steps.contract.outputs.base_url }}
      deployment_id: ${{ steps.contract.outputs.deployment_id }}
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.staging_base_url }}
      E2E_TEST_SUPABASE_URL: ${{ secrets.GARAGE_STAGING_SUPABASE_URL }}
      E2E_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.GARAGE_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.GARAGE_STAGING_VERCEL_BYPASS_SECRET }}
      RELEASE_CRITICAL_EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: contract
        name: Verify Staging-only execution contract
        run: |
          node apps/garage-link/scripts/qa/release-critical-preflight.mjs > "$RUNNER_TEMP/preflight.json"
          node -e "const value=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8')); if(value.state!=='PREFLIGHT_READY'||!(/^[0-9a-f]{40}$/i.test(value.source_sha??''))||!value.base_url||!/^dpl_[A-Za-z0-9]+$/.test(value.deployment_id??''))process.exit(1); for(const key of ['source_sha','base_url','deployment_id'])process.stdout.write(key+'='+value[key]+'\\n');" "$RUNNER_TEMP/preflight.json" >> "$GITHUB_OUTPUT"

  stage-auth-contract:
    name: Staging Auth redirect and password contract
    needs: preflight
    if: ${{ inputs.auth_config_mode == 'repair_staging_once' }}
    runs-on: ubuntu-latest
    environment: garage-link-commercial-staging
    timeout-minutes: 15
    env:
      GARAGE_STAGING_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.GARAGE_STAGING_SUPABASE_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply and read back the Staging-only Auth contract
        run: node apps/garage-link/scripts/qa/release-critical-stage-auth.mjs

  qa-lifecycle-contract:
    name: Registry-bound Staging CTA fixture contract
    needs: preflight
    if: ${{ needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    environment: garage-link-commercial-staging
    timeout-minutes: 10
    env:
      E2E_TEST_SUPABASE_URL: ${{ secrets.GARAGE_STAGING_SUPABASE_URL }}
      E2E_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.GARAGE_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read back the registry-bound Staging CTA fixture contract
        run: node apps/garage-link/scripts/qa/release-critical-qa-lifecycle-contract.mjs

  machine-gates:
    name: Release-critical machine-only gates
    needs: [preflight, stage-auth-contract, qa-lifecycle-contract]
    if: ${{ always() && needs.preflight.result == 'success' && (needs.stage-auth-contract.result == 'success' || needs.stage-auth-contract.result == 'skipped') && needs.qa-lifecycle-contract.result == 'success' }}
    runs-on: ubuntu-latest
    environment: garage-link-commercial-staging
    timeout-minutes: 50
    env:
      PLAYWRIGHT_BASE_URL: ${{ needs.preflight.outputs.base_url }}
      RELEASE_CRITICAL_CANDIDATE_SHA: ${{ needs.preflight.outputs.source_sha }}
      E2E_TEST_SUPABASE_URL: ${{ secrets.GARAGE_STAGING_SUPABASE_URL }}
      E2E_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.GARAGE_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.GARAGE_STAGING_VERCEL_BYPASS_SECRET }}
      RELEASE_CRITICAL_EXECUTION_MODE: machine_only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install release-critical browsers
        run: pnpm --filter @apps/garage-link exec playwright install --with-deps chromium webkit
      - name: Run callback mechanics, CTA, inquiry, and fixture gates with guaranteed teardown
        run: node apps/garage-link/scripts/qa/release-critical-journeys.mjs

  email-transport-state:
    name: Email transport state (non-blocking machine gate)
    needs: [preflight, machine-gates]
    if: ${{ always() && needs.preflight.result == 'success' && needs.machine-gates.result == 'success' }}
    runs-on: ubuntu-latest
    environment: garage-link-commercial-staging
    timeout-minutes: 5
    outputs:
      transport_ready: ${{ steps.transport.outputs.ready }}
    steps:
      - id: transport
        name: Record separated email transport state
        env:
          RELEASE_CRITICAL_EMAIL_MODE: ${{ inputs.email_mode }}
          RELEASE_CRITICAL_MANUAL_GMAIL_ADDRESS: ${{ secrets.GARAGE_STAGING_E2E_EMAIL }}
        run: |
          if [ "$RELEASE_CRITICAL_EMAIL_MODE" = "manual_gmail" ] && [ -n "$RELEASE_CRITICAL_MANUAL_GMAIL_ADDRESS" ]; then
            echo '{"state":"EMAIL_TRANSPORT_READY","mode":"manual_gmail"}'
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo '{"state":"EMAIL_TRANSPORT_WAITING","reason":"NO_PERMANENT_QA_TRANSPORT"}'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

  actual-email-gates:
    name: Actual email transport and callback gates
    needs: [preflight, machine-gates, email-transport-state]
    if: ${{ always() && needs.preflight.result == 'success' && needs.machine-gates.result == 'success' && needs.email-transport-state.outputs.transport_ready == 'true' }}
    runs-on: ubuntu-latest
    environment: garage-link-commercial-staging
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BASE_URL: ${{ needs.preflight.outputs.base_url }}
      RELEASE_CRITICAL_CANDIDATE_SHA: ${{ needs.preflight.outputs.source_sha }}
      E2E_TEST_SUPABASE_URL: ${{ secrets.GARAGE_STAGING_SUPABASE_URL }}
      E2E_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.GARAGE_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.GARAGE_STAGING_VERCEL_BYPASS_SECRET }}
      RELEASE_CRITICAL_EXECUTION_MODE: email_transport
      RELEASE_CRITICAL_MANUAL_GMAIL_ADDRESS: ${{ secrets.GARAGE_STAGING_E2E_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install release-critical browsers
        run: pnpm --filter @apps/garage-link exec playwright install --with-deps chromium webkit
      - name: Run actual signup and recovery email journeys
        run: node apps/garage-link/scripts/qa/release-critical-journeys.mjs

  production-email-transport:
    name: Production email transport classification (read-only)
    needs: preflight
    if: ${{ always() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@v4
      - id: classify
        name: Classify Production transport without mutation
        run: node apps/garage-link/scripts/qa/release-critical-production-transport.mjs

  final-clean-verdict:
    name: Release Critical convergence verdict
    needs: [preflight, stage-auth-contract, qa-lifecycle-contract, machine-gates, email-transport-state, actual-email-gates, production-email-transport]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Emit one converged verdict
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          AUTH_CONTRACT: ${{ needs.stage-auth-contract.result }}
          QA_LIFECYCLE_CONTRACT: ${{ needs.qa-lifecycle-contract.result }}
          MACHINE: ${{ needs.machine-gates.result }}
          TRANSPORT_READY: ${{ needs.email-transport-state.outputs.transport_ready }}
          ACTUAL_EMAIL: ${{ needs.actual-email-gates.result }}
          PRODUCTION_TRANSPORT: ${{ needs.production-email-transport.outputs.classification }}
        run: |
          if [ "$PREFLIGHT" != success ] || [ "$QA_LIFECYCLE_CONTRACT" != success ] || [ "$MACHINE" != success ]; then
            echo '{"state":"RELEASE_CRITICAL_NOT_READY","reason":"MACHINE_OR_PRODUCTION_TRANSPORT_GATE_FAILED"}'
            exit 1
          fi
          if [ "$PRODUCTION_TRANSPORT" != PRODUCTION_CUSTOM_SMTP_PROVEN ]; then
            echo '{"state":"RELEASE_CRITICAL_WAITING_PRODUCTION_TRANSPORT","classification":"'"$PRODUCTION_TRANSPORT"'"}'
            exit 1
          fi
          if [ "$TRANSPORT_READY" != true ]; then
            echo '{"state":"RELEASE_CRITICAL_WAITING_TRANSPORT","reason":"NO_PERMANENT_QA_TRANSPORT"}'
            exit 1
          fi
          if [ "$ACTUAL_EMAIL" != success ]; then
            echo '{"state":"RELEASE_CRITICAL_NOT_READY","reason":"ACTUAL_EMAIL_GATE_FAILED"}'
            exit 1
          fi
          echo '{"state":"RELEASE_CRITICAL_CONVERGED_PASS"}'
