name: Outbound funnel measurement CI

on:
  push:
    branches:
      - agent/outbound-funnel-measurement-20260915

jobs:
  verify-garage-link:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck GARAGE LINK
        run: pnpm --filter @apps/garage-link typecheck

      - name: Lint GARAGE LINK
        run: pnpm --filter @apps/garage-link lint

      - name: Build GARAGE LINK
        run: pnpm --filter @apps/garage-link build
