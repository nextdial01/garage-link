name: Verify GARAGE LINK

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify-garage-link:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://dummy-project.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: QA Node tests
        run: pnpm test:qa:lifecycle

      - name: QA manifest and checksum
        run: pnpm test:qa:manifest

      - name: Prepare isolated Docker image
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker pull public.ecr.aws/supabase/postgres:17.6.1.136; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Production isolated lane — QA DDL 0
        run: bash apps/garage-link/scripts/db/run-g0b-ci.sh

      - name: QA isolated apply regression rollback reapply
        run: pnpm test:qa:migrations

      - name: Verify GARAGE LINK
        run: pnpm verify:garage-link

      - name: Install Japanese font for visual QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: LP rendered visual QA
        run: pnpm --filter @apps/garage-link test:lp:visual

      - name: Upload LP visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garage-link-lp-visual-audit
          path: apps/garage-link/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
